name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        required: true
        default: all
        type: choice
        options:
          - suNextO
          - suNextN
          - all

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------
      # Checkout kernel (shallow)
      # --------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # --------------------------
      # Install dependencies
      # --------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential \
            curl flex git libssl-dev \
            python3 rsync unzip cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip

      # --------------------------
      # Cache Clang
      # --------------------------
      - name: Cache Clang
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r584948

      # --------------------------
      # Setup Clang
      # --------------------------
      - name: Setup Clang
        run: |
          if [ ! -d clang/bin ]; then
            mkdir -p clang
            curl -L \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r584948.tar.gz \
              | tar -xz -C clang
          fi
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # --------------------------
      # Build Variants
      # --------------------------
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=ahmed
          export KBUILD_BUILD_HOST=AAZ-PC
          TARGET="${{ github.event.inputs.variant }}"

          if [ "$TARGET" = "all" ]; then
            VARIANTS=("suNextO" "suNextN")
          else
            VARIANTS=("$TARGET")
          fi
          # --------------------------
          # Clone KernelSU-Next
          # --------------------------
           
          echo "Cloning KernelSU-Next..."
          rm -rf KernelSU-Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git

          cd KernelSU-Next
          git checkout --force legacy

          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -n "$LATEST_TAG" ]; then
            LEGACY_TAG="${LATEST_TAG}-legacy"
            echo "Latest version: $LATEST_TAG"
            echo "Creating legacy tag: $LEGACY_TAG"
            git tag "$LEGACY_TAG" HEAD
          else
            echo "Error: No vX.X.X tags found."
            exit 1
          fi
          cd ..

          DATE_TIME=$(TZ="Asia/Karachi" date +"%d%m%y-%H%M%S")

          for VARIANT in "${VARIANTS[@]}"; do
            echo "=================================="
            echo "Building variant: $VARIANT"
            echo "=================================="

            # Reset tracked files (preserve out/, clang/, anykernel-*)
            git reset --hard HEAD
            git clean -fdx -e out/ -e clang/ -e 'anykernel-*/'
            mkdir -p out

            # --------------------------
            # Branch mapping
            # --------------------------
            BRANCH="13.0.0-perf-ksun"
            
            # revert old display driver commits
            if [ "$VARIANT" = "suNextN" ]; then
              git revert 8e16b7e0ebc4297507716098f2a902b7597943ee --no-edit
              git revert ccc5614010cace6044e14f04de69283ea56c3e07 --no-edit
              git revert 2b74f8d8cdcbb294daea68950da22b053e97d7be --no-edit
            fi
            
            # --------------------------
            # Defconfig
            # --------------------------
            make O=out vendor/spes-stock_defconfig

            LOCALVERSION="-$VARIANT"

            # --------------------------
            # KernelSU Config
            # --------------------------
            scripts/config --file out/.config -e CONFIG_KSU
            scripts/config --file out/.config -d CONFIG_KSU_MANUAL_HOOK
            scripts/config --file out/.config -d CONFIG_KSU_ALLOWLIST_WORKAROUND
            scripts/config --file out/.config -d CONFIG_KSU_DEBUG
            scripts/config --file out/.config -e CONFIG_KSU_KPROBES_HOOK
            
            
            make O=out olddefconfig

            # --------------------------
            # Compile
            # --------------------------
            make -j$(nproc) O=out LOCALVERSION=$LOCALVERSION Image.gz-dtb dtbo.img

            # --------------------------
            # AnyKernel Packaging
            # --------------------------
            ANYKERNEL_DIR="anykernel-$VARIANT"
            if [ ! -d "$ANYKERNEL_DIR" ]; then
              git clone --depth=1 https://github.com/ahmedhanbal/anykernel "$ANYKERNEL_DIR"
            fi

            cp out/arch/arm64/boot/Image.gz-dtb "$ANYKERNEL_DIR/"
            cp out/arch/arm64/boot/dtbo.img "$ANYKERNEL_DIR/"

            sed -i "s/^kernel.string=.*/kernel.string=hanbal-perf-$VARIANT/" \
              "$ANYKERNEL_DIR/anykernel.sh"

            rm -rf "$ANYKERNEL_DIR/.git"

          done

      # --------------------------
      # Save Clang Cache always
      # --------------------------
      - name: Save Clang Cache
        if: always()
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r584948

      # --------------------------
      # Timestamp
      # --------------------------
      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(TZ='Asia/Karachi' date +'%d%m%y-%H%M%S')" >> $GITHUB_OUTPUT

      # --------------------------
      # Upload Artifacts
      # --------------------------
      - name: Upload suNextO
        if: ${{ github.event.inputs.variant == 'suNextO' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-perf-suNextO-${{ steps.timestamp.outputs.time }}
          path: anykernel-suNextO/

      - name: Upload suNextN
        if: ${{ github.event.inputs.variant == 'suNextN' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-perf-suNextN-${{ steps.timestamp.outputs.time }}
          path: anykernel-suNextN/
