name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        required: true
        default: all
        type: choice
        options:
          - baseO
          - baseN
          - all

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------
      # Checkout kernel
      # --------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # --------------------------
      # Install dependencies
      # --------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential \
            curl flex git libssl-dev \
            python3 rsync unzip cpio \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zip

      # --------------------------
      # Cache Clang
      # --------------------------
      - name: Cache Clang
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r584948

      # --------------------------
      # Setup Clang
      # --------------------------
      - name: Setup Clang
        run: |
          if [ ! -d clang/bin ]; then
            mkdir -p clang
            curl -L \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r584948.tar.gz \
              | tar -xz -C clang
          fi
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # --------------------------
      # Build Variants
      # --------------------------
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=ahmed
          export KBUILD_BUILD_HOST=AAZ-PC
          TARGET="${{ github.event.inputs.variant }}"

          if [ "$TARGET" = "all" ]; then
            VARIANTS=("baseO" "baseN")
          else
            VARIANTS=("$TARGET")
          fi

          DATE_TIME=$(TZ="Asia/Karachi" date +"%d%m%y-%H%M%S")

          for VARIANT in "${VARIANTS[@]}"; do
            echo "=================================="
            echo "Building variant: $VARIANT"
            echo "=================================="

            # Reset tracked files (preserve out/, clang/, anykernel-*)
            git reset --hard HEAD
            git clean -fdx -e out/ -e clang/ -e 'anykernel-*/'
            mkdir -p out

            # --------------------------
            # Branch mapping
            # --------------------------
            BRANCH="13.0.0-perf"

            if [ "$VARIANT" = "baseN" ]; then
              git config user.name "$(git log -1 --format='%an')"
              git config user.email "$(git log -1 --format='%ae')"
              git revert 8e16b7e0ebc4297507716098f2a902b7597943ee --no-edit
              git revert ccc5614010cace6044e14f04de69283ea56c3e07 --no-edit
              git revert 2b74f8d8cdcbb294daea68950da22b053e97d7be --no-edit
            fi

          
            # --------------------------
            # Defconfig
            # --------------------------
            make O=out vendor/spes-stock_defconfig

            LOCALVERSION="-$VARIANT"
            make O=out olddefconfig

            # --------------------------
            # Compile
            # --------------------------
            make -j$(nproc) O=out LOCALVERSION=$LOCALVERSION Image.gz-dtb dtbo.img

            # --------------------------
            # AnyKernel Packaging
            # --------------------------
            ANYKERNEL_DIR="anykernel-$VARIANT"
            if [ ! -d "$ANYKERNEL_DIR" ]; then
              git clone --depth=1 https://github.com/ahmedhanbal/anykernel "$ANYKERNEL_DIR"
            fi

            cp out/arch/arm64/boot/Image.gz-dtb "$ANYKERNEL_DIR/"
            cp out/arch/arm64/boot/dtbo.img "$ANYKERNEL_DIR/"

            sed -i "s/^kernel.string=.*/kernel.string=hanbal-perf-$VARIANT/" \
              "$ANYKERNEL_DIR/anykernel.sh"

            rm -rf "$ANYKERNEL_DIR/.git"

          done

      # --------------------------
      # Save Clang Cache always
      # --------------------------
      - name: Save Clang Cache
        if: always()
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-r584948

      # --------------------------
      # Timestamp
      # --------------------------
      - name: Generate timestamp
        id: timestamp
        run: echo "time=$(TZ='Asia/Karachi' date +'%d%m%y-%H%M%S')" >> $GITHUB_OUTPUT

      # --------------------------
      # Upload Artifacts
      # --------------------------
      - name: Upload baseO
        if: ${{ github.event.inputs.variant == 'baseO' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-perf-baseO-${{ steps.timestamp.outputs.time }}
          path: anykernel-baseO/

      - name: Upload baseN
        if: ${{ github.event.inputs.variant == 'baseN' || github.event.inputs.variant == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: hanbal-perf-baseN-${{ steps.timestamp.outputs.time }}
          path: anykernel-baseN/
